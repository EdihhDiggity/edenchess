<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Eden Chess</title>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin-top: 30px;
        }

        a {
            color: lime;
            text-decoration: none;
        }

        a:hover {
            color: green;
        }

        #board {
            width: 400px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
        }

        .box {
            /* background-color: yellow; */
            border: 1px solid white;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>

<body>
    <h1>Eden Chess</h1>
    <div class="grid" id="openings-container">
    </div>

    <script>
        fetch('/static/openings_data/openings.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('openings-container');

                data.forEach(opening => {
                    const box = document.createElement('div');
                    box.className = `box ${opening.cssClass}`;

                    box.innerHTML = `
                        <h3>${opening.title}</h3>
                        <div class="practice-link">
                        <a href="${opening.practiceLink}">Practice</a>
                        </div>
                        <hr>
                        <div class="references" style="text-align:left;">
                        <strong>References:</strong>
                        <ul>
                            ${opening.references.map(r => `<li><a href="${r}">${r}</a></li>`).join('')}
                        </ul>
                        </div>
                    `;

                    container.appendChild(box);
                });
            })
            .catch(err => console.error(err));
    </script>

</body>

</html>
